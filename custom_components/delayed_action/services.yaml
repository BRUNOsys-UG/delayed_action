execute:
  description: Schedule an action with a delay or at a specific time.
  fields:
    entity_id:
      required: true
      selector:
        entity: {}
    action:
      required: true
      example: turn_on
      selector:
        text: {}
    delay:
      example: 10
      selector:
        number:
          min: 0
          mode: box
          unit_of_measurement: s
    datetime:
      example: "2026-12-01T18:00:00+01:00"
      selector:
        datetime: {}
    data:
      description: Additional service data.
      example: {"brightness": 128}
      selector:
        object: {}
cancel:
  description: Cancel scheduled actions for an entity or a specific task.
  fields:
    entity_id:
      required: true
      selector:
        entity: {}
    task_id:
      selector:
        text: {}
list:
  description: Publish scheduled actions via the existing response event.
  fields:
    entity_id:
      selector:
        entity: {}
get_config:
  description: Publish configured domains via the existing response event.
